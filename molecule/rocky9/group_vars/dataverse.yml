# molecule/rocky9/group_vars/molecule.yml

# Dataverse core config
dataverse_hostname: localhost
dataverse_siteurl: "http://localhost:8080"
dataverse_http_port: 8080
dataverse_adminemail: "admin@example.edu"
dataverse_service_email: "noreply@example.edu"
dataverse_adminpass: admin1

# Optional features
dataverse_use_ssl: false
dataverse_use_shib: false
dataverse_enable_telemetry: false

# DOI settings
dataverse_doi_provider: none
dataverse_doi_authority: "10.5072"
dataverse_doi_username: ""
dataverse_doi_password: ""

# Email / SMTP
dataverse_smtp_host: localhost
dataverse_smtp_port: 25

# Apache settings
dataverse_apache_config_dir: "/etc/httpd/conf.d"
dataverse_apache_user: apache
dataverse_apache_group: apache

# Solr
dataverse_solr_version: 9.8.0
dataverse_solr_core_name: collection1

# PostgreSQL
dataverse_postgresql_version: 16
dataverse_postgresql_user: dvnuser
dataverse_postgresql_db: dvndb
dataverse_postgresql_host: localhost
dataverse_postgresql_port: 5432
dataverse_postgresql_password: dvnsecret
dataverse_postgresql_admin_user: postgres
dataverse_postgresql_admin_password: DVn33dsth1s
dataverse_postgresql_log_lock_waits: true
dataverse_postgresql_log_statements: none
dataverse_postgresql_query_counts: false
dataverse_use_rds: false

# Payara
dataverse_payara_version: 5.2022.5
dataverse_payara_domain: domain1
dataverse_payara_listen_address: 0.0.0.0  # Listen on all interfaces for Docker port mapping

# JVM options
dataverse_jvm_options:
  - "-Xms512m"
  - "-Xmx1024m"
  - "-XX:+UseG1GC"

# PostgreSQL backups (disabled in molecule)
dataverse_postgresql_backups_enabled: false
dataverse_postgresql_backup_rootdir: /opt/pg_backups
dataverse_postgresql_backup_backupdir: backups
dataverse_postgresql_backup_host: localhost
dataverse_postgresql_backup_user: postgres
dataverse_postgresql_backup_custom: 'yes'
dataverse_postgresql_backup_globals: 'no'
dataverse_postgresql_backup_plain: 'no'

rserve_install: false

# --- compatibility shim: keep flat vars, satisfy role's nested lookups ---

# Role expects: apache.port, apache.ssl.*, apache.block.*, etc.
apache:
  enabled: true    # Install/configure Apache
  port: 80
  public_fqdn: ""  # Leave empty to use ansible_fqdn
  ssl:
    enabled: false
    port: 443
    cert: ""
    key: ""
    interm: ""
    remote_cert: false
    pem:
      cert: ""
  behind_ssl_reverse_proxy: false
  block:
    admin: true          # Block /api/admin via proxy
    destroy: true        # Block destroy endpoint
    builtin_users: true  # Block builtin-users endpoint
    sword: true          # Block SWORD API
  use_ajp: true         # Use AJP connector (recommended)

letsencrypt:
  enabled: false

# Role expects: dataverse.payara.*, dataverse.thumbnails, dataverse.frontend.*, etc.
# NOTE: Must specify full sections due to Ansible dict merging behavior
dataverse:
  version: '6.8'
  adminpass: admin1
  allow_signups: true
  branding:
    enabled: false
  language:
    enabled: false
  licenses:
    enabled: false
  thumbnails: false
  srcdir: /opt/dataverse/dataverse
  uploads_dir: /tmp
  usermgmtkey: burrito
  service_email: noreply@example.edu
  smtp: localhost
  memheap: 2048
  file_fixity_checksum_algorithm: "MD5"
  google_analytics_key:
  frontend:
    enabled: false
  previewers:
    enabled: false
    on_same_server: false
    zip_url: https://github.com/gdcc/dataverse-previewers/releases/download/1.2/dataverse-previewers-1.2.zip
    dir: /var/www/html
  api:
    test_suite: false
    allow_lookup: true
    blocked_endpoints: "builtin-users,test"
    blocked_policy: ""
    location: "http://localhost:8080/api"
  jacoco:
    enabled: false
    home: /tmp/jacoco
    version: 0.8.12
  sampledata:
    enabled: false
    dir: /tmp/sampledata
    repo: https://github.com/IQSS/dataverse-sample-data.git
    branch: master
    venv: /tmp/sampledata/venv
  custom_sampledata:
    enabled: false
  custom_metadata_blocks:
    enabled: false
  copyright: "Test Organization"
  counter:
    enabled: false
  unittests:
    enabled: false
    argument: '-DcompilerArgument=-Xlint:unchecked test -P all-unit-tests'
  options:
    filepids:
    maxfileuploadsizeinbytes:
    provcollectionenabled:
    tabularingestsizelimit:
  default:
    config:
    storage_id: file
  demo: false
  deployment:
    upgrade_only: false
  filesdirs:
    - label: file
      path: /usr/local/dvn/data
  pid:
    authority: "10.5072"
    protocol: doi
    shoulder: "FK2/"
  doi:
    baseurl: "https://mds.test.datacite.org/"
    dataciterestapiurl: "https://api.test.datacite.org"
    mdcbaseurl: "https://api.test.datacite.org/"
    provider: FAKE
    username: "testaccount"
    password: "notmypassword"
  externaltools:
    datacurationtool:
      enabled: false
    dataexplorer:
      enabled: false
    wholetale:
      enabled: false
  handlenet:
    independenthandleservice: 'false'
  solr:
    download_url: "https://archive.apache.org/dist/solr/solr/{{ dataverse_solr_version }}/solr-{{ dataverse_solr_version }}.tgz"
    group: solr
    root: /usr/local/solr
    user: solr
    version: "{{ dataverse_solr_version }}"
    listen: 127.0.0.1
    checksum: sha256:9948dcf798c196b834c4cbb420d1ea5995479431669d266c33d46548b67e69e1
  payara:
    user: dataverse
    group: dataverse
    domain: domain1
    logformat: ulf
    adminuser: admin
    adminpass: notPr0d
    siteurl:
    listen_address: 0.0.0.0  # OVERRIDE: Must listen on all interfaces for Docker (default: 127.0.0.1)
    launch_timeout: 180
    request_timeout: 1800
    root: /usr/local
    dir: payara6
    zipurl: https://nexus.payara.fish/repository/payara-community/fish/payara/distributions/payara/6.2025.3/payara-6.2025.3.zip
    zipchecksum: sha256:88f5c1e5b40ea4bc60ae3e34e6858c1b33145dc06c4b05c3d318ed67c131e210

# Role expects: db.use_rds and db.postgres.*
db:
  use_rds: "{{ dataverse_use_rds | default(false) }}"
  postgres:
    enabled: true
    name: "{{ dataverse_postgresql_db }}"
    user: "{{ dataverse_postgresql_user }}"
    pass: "{{ dataverse_postgresql_password }}"
    adminpass: "{{ dataverse_postgresql_admin_password }}"
    host: "{{ dataverse_postgresql_host }}"
    port: "{{ dataverse_postgresql_port }}"
    version: "{{ dataverse_postgresql_version }}"
    jdbcurl:
    log_lock_waits: "{{ dataverse_postgresql_log_lock_waits | default(true) }}"
    log_statements: "{{ dataverse_postgresql_log_statements | default('none') }}"
    query_counts: "{{ dataverse_postgresql_query_counts | default(false) }}"
    replication:
      enabled: false
      servers: []
  backups:
    enabled: false

# Role expects: postgres_config_dir for lineinfile edits (Rocky default path)
postgres_config_dir: "/var/lib/pgsql/data"

# Role/tasks reference solr_url / solr_download_url
solr_download_url: "https://archive.apache.org/dist/solr/solr/{{ dataverse_solr_version }}/solr-{{ dataverse_solr_version }}.tgz"
solr_url: "{{ solr_download_url }}"

# Additional nested dicts required by templates
prometheus:
  install: false

schemaspy:
  enabled: false

shibboleth:
  enabled: false