---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: rocky9
    image: eniocarboni/docker-rockylinux-systemd:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    # remove or satisfy this:
    # groups:
    #   - dataverse
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "$HOME/podman-containerd"
    cgroupns_mode: host
    published_ports:
      - "8080:8080"

provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      log_path: ./ansible-output.log
  roles_path:
    - ..
  playbooks:
    converge: ../../site.yml

verifier:
  name: testinfra
