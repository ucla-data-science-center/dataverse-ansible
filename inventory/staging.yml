# inventory/staging.yml
# Ansible inventory for UCLA Dataverse staging environment
#
# Usage:
#   ansible-playbook -i inventory/staging.yml site.yml
#
# EC2 instance created via Terraform

---
all:
  children:
    staging:
      hosts:
        dataverse-staging:
          # EC2 instance connection details
          ansible_host: 44.230.113.91
          ansible_user: rocky
          ansible_ssh_private_key_file: ~/.ssh/dataverse-ansible

          # Connection settings
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
          ansible_python_interpreter: /usr/bin/python3

      vars:
        ansible_become: yes
        ansible_become_method: sudo
