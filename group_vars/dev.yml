# group_vars/dev.yml
# Development/Test environment configuration for Dataverse 6.8
# Uses external AWS RDS PostgreSQL instead of local PostgreSQL
#
# This file is used with inventory from: terraform-dataverse/environments/tim/inventory-dev.yml

---
# =============================================================================
# REQUIRED VARIABLES (checked by site.yml pre_tasks)
# =============================================================================
dataverse_hostname: "staging.ucladataverse.dev"
dataverse_adminpass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          61626633376333653337323536393531356635633237343636336234383937383637643232326366
          6138303434663833313432373539633234323731356561620a646262313131366634333631303535
          66613539303633663932396633323361393662383231613763643065633561356332643239373663
          6463643838333265380a656138343665616265393732643866343539626633373261623839653365
          6462
dataverse_postgresql_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36623631613337376134316462613265636339323830656262333437336564663033336633343937
          3436303432333238323034316139346634653535613835300a383837666239633361343237333332
          63313036363765366137316130363536613638336438623336356261623164663838643036653834
          6537373639383136380a663530376138306534386631613665383466346162393639366163643862
          3735
payara_adminpass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36326666373333386134336339326164386232643333626333323935303530623838363164363635
          3439363866636339303434636239383865323733383366660a666334653837613938376166343039
          36313534663637356264333963663131373664386266346439633462663864353539633932396430
          3533656462656662360a643133346439373565343839366266366538663339306134633062313131
          3734

# Additional top-level variables referenced by the role
dataverse_siteurl: "https://staging.ucladataverse.dev"
dataverse_adminemail: "admin@test.dataverse.ucla.edu"
servername: "staging.ucladataverse.dev"
any_errors_fatal: true
# =============================================================================
# DATABASE CONFIGURATION - External RDS
# =============================================================================
db:
  use_rds: true
  postgres:
    enabled: false  # CRITICAL: Do NOT install local PostgreSQL
    name: dvndb
    user: postgres
    pass: "{{ dataverse_postgresql_password }}"
    adminpass: "{{ dataverse_postgresql_password }}"
    host: "{{ db_host }}"
    port: 5432
    version: 16
    jdbcurl:
    log_lock_waits: true
    log_statements: all  # Enable for debugging in dev
    query_counts: false
    replication:
      enabled: false
      servers: []
  backups:
    enabled: false

# =============================================================================
# DATAVERSE CONFIGURATION
# =============================================================================
dataverse:
  version: '6.8'
  adminpass: "{{ dataverse_adminpass }}"
  allow_signups: true
  thumbnails: false
  srcdir: /opt/dataverse/dataverse
  uploads_dir: /tmp
  usermgmtkey: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          39643032613662323163313162663930353532363963343264386139323661653966646464303730
          6432306534336233316333313530373164663966346238340a653665313539353632303839656665
          63643439373230636265383539656432613734336362383130323162316431386230303135333232
          3838333064613733650a663134376630386464333861303639663265363136656430363063383664
          3631
  service_email: noreply@test.dataverse.ucla.edu
  smtp: localhost
  memheap: 4096
  file_fixity_checksum_algorithm: "MD5"
  google_analytics_key:
  copyright: "UC Regents"

  # UCLA Branding
  branding:
    enabled: true
    directory: "{{ playbook_dir }}/files/branding"
    favicons_directory: "{{ playbook_dir }}/files/favicons"
    support_url: "https://uclalibrary.atlassian.net/servicedesk/customer/portal/5/group/13/create/46"
    fileSettings:
      - setting: HeaderCustomizationFile
        file: custom-header.html
      - setting: StyleCustomizationFile
        file: custom-stylesheet.css
      - setting: LogoCustomizationFile
        file: dataverseUCLA_logo.png
      - setting: HomePageCustomizationFile
        file: custom-homepage.html
      - setting: FooterCustomizationFile
        file: custom-footer.html
    otherSettings:
      - setting: FooterCopyright
        value: " UC Regents"
      - setting: InstallationName
        value: "UCLA Dataverse (TEST)"

  # Root dataverse
  root:
    name: "UCLA Dataverse (TEST)"
    affiliation: "UCLA Library"
    description: "TEST ENVIRONMENT - UCLA Dataverse is a repository for research data."

  # Language packs
  language:
    enabled: true
    languages:
      - locale: en_US
        title: English
      - locale: es_ES
        title: Spanish
      - locale: zh_CN
        title: Chinese (Simplified)
      - locale: ja_JP
        title: Japanese
      - locale: ko_KR
        title: Korean
    language_packs:
      source: https://github.com/GlobalDataverseCommunityConsortium/dataverse-language-packs.git
      version: develop
    lang_directory: "/opt/dv/lang"

  # Licenses
  licenses:
    enabled: true
    user: dataverseAdmin
    licenses:
      - name: CC0 1.0
        uri: http://creativecommons.org/publicdomain/zero/1.0
        shortDescription: Creative Commons CC0 1.0 Universal Public Domain Dedication.
        iconUrl: https://licensebuttons.net/p/zero/1.0/88x31.png
        active: true
        sortOrder: 1
      - name: CC BY 4.0
        uri: http://creativecommons.org/licenses/by/4.0
        shortDescription: Creative Commons Attribution 4.0 International License.
        iconUrl: https://licensebuttons.net/l/by/4.0/88x31.png
        active: true
        sortOrder: 2

  # Previewers
  previewers:
    enabled: true
    on_same_server: true
    zip_url: https://github.com/gdcc/dataverse-previewers/releases/download/1.2/dataverse-previewers-1.2.zip
    dir: /var/www/html

  # API
  api:
    test_suite: false
    allow_lookup: true
    blocked_endpoints: "builtin-users,test"
    blocked_policy: ""
    location: "http://localhost:8080/api"

  # JaCoCo
  jacoco:
    enabled: false
    home: /tmp/jacoco
    version: 0.8.12

  # Sample data - Disabled for migration test (importing production database)
  sampledata:
    enabled: false
    use_api: true
    collection_name: "UCLA Data Science Center"
    collection_alias: "ucla-dsc"
    collection_description: "Research data from the UCLA Library Data Science Center."
    contact_email: "datascience@library.ucla.edu"
    affiliation: "UCLA Library"
    dir: /tmp/sampledata
    repo: https://github.com/IQSS/dataverse-sample-data.git
    branch: master
    venv: /tmp/sampledata/venv

  # Custom sample data
  custom_sampledata:
    enabled: false
    custom_sampledir: "{{ playbook_dir }}/custom_sampledata"
    custom_sampledatasets: "{{ playbook_dir }}/custom_sampledata/datasets"
    custom_sampledataverses: "{{ playbook_dir }}/custom_sampledata/dataverses"
    custom_sampleusers: "{{ playbook_dir }}/custom_sampledata/users"
    custom_samplefiles: "{{ playbook_dir }}/custom_sampledata/files"

  # Custom metadata blocks
  custom_metadata_blocks:
    enabled: true
    urls:
      - https://github.com/IQSS/dataverse/files/3744336/codemeta.tsv.txt
      - https://raw.githubusercontent.com/ucla-data-science-center/dataverse-custom-metadata/main/helada3.tsv
      - https://raw.githubusercontent.com/IQSS/dataverse/develop/scripts/api/data/metadatablocks/geospatial.tsv
      - https://raw.githubusercontent.com/IQSS/dataverse/develop/scripts/api/data/metadatablocks/social_science.tsv
      - https://raw.githubusercontent.com/IQSS/dataverse/develop/scripts/api/data/metadatablocks/astrophysics.tsv
      - https://raw.githubusercontent.com/IQSS/dataverse/develop/scripts/api/data/metadatablocks/biomedical.tsv
      - https://raw.githubusercontent.com/IQSS/dataverse/develop/scripts/api/data/metadatablocks/journals.tsv

  # Unit tests
  unittests:
    enabled: false
    argument: '-DcompilerArgument=-Xlint:unchecked test -P all-unit-tests'

  # Options
  options:
    filepids:
    maxfileuploadsizeinbytes:
    provcollectionenabled:
    tabularingestsizelimit:

  # Default storage - use S3
  default:
    config:
    storage_id: s3

  demo: false

  # Deployment
  deployment:
    upgrade_only: false

  # File storage - keep local as fallback, but S3 is primary
  filesdirs:
    - label: file
      path: /usr/local/dvn/data

  # PIDs - FAKE provider for testing (won't mint real DOIs)
  pid:
    authority: "10.5072"
    protocol: doi
    shoulder: "FK2/"

  # DOI - FAKE provider for testing
  doi:
    baseurl: "https://mds.test.datacite.org/"
    dataciterestapiurl: "https://api.test.datacite.org"
    mdcbaseurl: "https://api.test.datacite.org/"
    provider: FAKE
    username: "testaccount"
    password: "notmypassword"

  # Frontend (SPA)
  frontend:
    enabled: false
    branch: develop
    docroot:
      base: /var/www/html
      dir: spa
    nodejs:
      version: 18
    repo: "http://github.com/IQSS/dataverse-frontend"
    srcdir: /tmp/dataverse-frontend

  # External tools
  externaltools:
    datacurationtool:
      enabled: false
      method: demo
    dataexplorer:
      enabled: true
    wholetale:
      enabled: false

  # Harvest clients
  harvest_clients: []

  # Handle.net
  handlenet:
    independenthandleservice: 'false'
    admcredfile: "/opt/dv/admpriv.bin"
    admcredfile_source: files/handlenet/admcredfile

  # Counter/Make Data Count
  counter:
    enabled: false
    hub_api_token: set_me_in_secrets
    hub_base_url: "https://api.datacite.org"
    machines_url: "https://raw.githubusercontent.com/CDLUC3/Make-Data-Count/master/user-agents/lists/machine.txt"
    maxmind_geoip_country_path: "maxmind_geoip/GeoLite2-Country.mmdb"
    output_file: "/dataverse/sushi_sample_logs"
    output_format: json
    platform: dash
    robots_url: "https://raw.githubusercontent.com/CDLUC3/Make-Data-Count/master/user-agents/lists/robot.txt"
    version: "0.1.04"
    upload_to_hub: false
    user: counter
    year_month: "2018-05"

  # Solr
  solr:
    download_url: "https://archive.apache.org/dist/solr/solr/9.8.0/solr-9.8.0.tgz"
    group: solr
    root: /usr/local/solr
    user: solr
    version: 9.8.0
    listen: 127.0.0.1
    checksum: sha256:9948dcf798c196b834c4cbb420d1ea5995479431669d266c33d46548b67e69e1

  # Payara
  payara:
    user: dataverse
    group: dataverse
    domain: domain1
    logformat: ulf
    adminuser: admin
    adminpass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36326666373333386134336339326164386232643333626333323935303530623838363164363635
          3439363866636339303434636239383865323733383366660a666334653837613938376166343039
          36313534663637356264333963663131373664386266346439633462663864353539633932396430
          3533656462656662360a643133346439373565343839366266366538663339306134633062313131
          3734
    siteurl: "https://staging.ucladataverse.dev"
    listen_address: 127.0.0.1
    launch_timeout: 180
    request_timeout: 1800
    root: /usr/local
    dir: payara6
    zipurl: https://nexus.payara.fish/repository/payara-community/fish/payara/distributions/payara/6.2025.3/payara-6.2025.3.zip
    zipchecksum: sha256:88f5c1e5b40ea4bc60ae3e34e6858c1b33145dc06c4b05c3d318ed67c131e210

# =============================================================================
# APACHE CONFIGURATION
# =============================================================================
apache:
  enabled: true
  port: 80
  public_fqdn: "staging.ucladataverse.dev"
  ssl:
    enabled: true
    port: 443
    cert: ""
    key: ""
    interm: ""
    remote_cert: false
    pem:
      cert: ""
  behind_ssl_reverse_proxy: false
  block:
    admin: false  # Allow admin API for testing
    destroy: false  # Allow destroy for testing
    builtin_users: false  # Allow builtin users for testing
    sword: false
  use_ajp: true

letsencrypt:
  enabled: true
  certbot:
    user: certbot
    email: tdennis@library.ucla.edu
    test_cert: true  # staging certs during iterative rebuilds; flip to false only at production cutover (Phase 7)
    autorenew: true

# =============================================================================
# ADDITIONAL SERVICES
# =============================================================================
prometheus:
  install: false

schemaspy:
  enabled: false

shibboleth:
  enabled: false

rserve:
  install: false
  host: localhost
  port: 6311
  user: rserve
  group: rserve
  pass: rserve
  workdir: /tmp/Rserv

postfix:
  enabled: true

sshkeys:
  enabled: false

# =============================================================================
# S3 STORAGE - Using IAM Instance Profile for authentication
# =============================================================================
s3:
  enabled: true
  # Use IAM instance profile for authentication (EC2 has role attached via Terraform)
  use_iam_role: true
  access_key: ""
  secret_access_key: ""
  # Bucket created by Terraform (from inventory: dataverse_s3_bucket)
  bucket_name: "{{ dataverse_s3_bucket }}"
  region: "us-west-2"
  location_constraint: "us-west-2"
  # S3 storage configuration
  storage_driver_id: s3
  files_type: s3
  label: "s3-storage"
  # Direct upload/download (requires CORS)
  download_redirect: true
  upload_redirect: true
  cors_already_set: false
  create_bucket: false  # Bucket already created by Terraform
  custom_endpoint_url: ""
  path_style_access: false  # Use virtual-hosted style for real AWS S3
  url_expiration_minutes: 60
  payload_signing: false
  chunked_encoding: true

# =============================================================================
# MIGRATION SETTINGS - For 5.x to 6.x migration
# =============================================================================
migration:
  # Create missing JPA tables before Flyway migration
  create_jpa_tables: true

  # Sub-dataverse logos migration
  # Copies logos from files/migration/logos/ to Payara docroot
  logos:
    enabled: true
