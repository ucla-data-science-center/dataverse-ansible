# group_vars/all.yml
# Base configuration inherited by all environments
#
# This file defines the complete nested dictionary structures required by the role
# to avoid Ansible's dict merging issues. Individual environments (staging.yml,
# production.yml) should override specific values but maintain the full structure.
#
# See: https://docs.ansible.com/ansible/latest/reference_appendices/config.html#default-hash-behaviour

---
# =============================================================================
# TOP-LEVEL VARIABLES
# =============================================================================
dataverse_system_email: "admin@example.org"

# =============================================================================
# APACHE CONFIGURATION
# =============================================================================
apache:
  enabled: true
  port: 80
  public_fqdn: ""
  ssl:
    enabled: false
    port: 443
    cert: ""
    key: ""
    interm: ""
    remote_cert: false
    pem:
      cert: ""
  behind_ssl_reverse_proxy: false
  block:
    admin: true
    destroy: true
    builtin_users: true
    sword: true
  use_ajp: true

letsencrypt:
  enabled: false

# =============================================================================
# DATAVERSE CONFIGURATION
# =============================================================================
# NOTE: This complete structure must be maintained in environment-specific files
# Individual keys can be overridden, but the full nested structure should be present

dataverse:
  version: '6.8'
  adminpass: admin  # Default admin password - CHANGE IN PRODUCTION
  allow_signups: true
  thumbnails: false
  srcdir: /opt/dataverse/dataverse
  uploads_dir: /tmp
  usermgmtkey: burrito
  service_email: noreply@example.edu
  smtp: localhost
  memheap: 2048
  file_fixity_checksum_algorithm: "MD5"
  google_analytics_key:
  copyright: ""

  # Branding
  branding:
    enabled: false
    directory: "{{ playbook_dir }}/files/branding"
    favicons_directory: "{{ playbook_dir }}/files/favicons"
    fileSettings: []
    otherSettings: []

  # Language packs
  language:
    enabled: true
    languages:
      - locale: en_US
        title: English
    language_packs:
      source: https://github.com/GlobalDataverseCommunityConsortium/dataverse-language-packs.git
      version: develop
    lang_directory: "{{ dataverse_misc_files_dir | default('/opt/dv') }}/lang"

  # Licenses
  licenses:
    enabled: true
    user: dataverseAdmin
    licenses:
      - name: CC0 1.0
        uri: http://creativecommons.org/publicdomain/zero/1.0
        shortDescription: Creative Commons CC0 1.0 Universal Public Domain Dedication.
        iconUrl: https://licensebuttons.net/p/zero/1.0/88x31.png
        active: true
        sortOrder: 1

  # Frontend (SPA)
  frontend:
    enabled: false
    branch: develop
    docroot:
      base: /var/www/html
      dir: spa
    nodejs:
      version: 18
    repo: "http://github.com/IQSS/dataverse-frontend"
    srcdir: /tmp/dataverse-frontend

  # Previewers
  previewers:
    enabled: true
    on_same_server: true
    zip_url: https://github.com/gdcc/dataverse-previewers/releases/download/1.2/dataverse-previewers-1.2.zip
    dir: /var/www/html

  # API
  api:
    test_suite: false
    allow_lookup: true
    blocked_endpoints: "builtin-users,test"
    blocked_policy: ""
    location: "http://localhost:8080/api"

  # JaCoCo (code coverage)
  jacoco:
    enabled: false
    home: /tmp/jacoco
    version: 0.8.12

  # Sample data
  sampledata:
    enabled: false
    use_api: true
    collection_name: "Example Collection"
    collection_alias: "example"
    collection_description: "Example collection description"
    contact_email: "admin@example.edu"
    affiliation: "Example University"
    dir: /tmp/sampledata
    repo: https://github.com/IQSS/dataverse-sample-data.git
    branch: master
    venv: /tmp/sampledata/venv

  # Custom sample data
  custom_sampledata:
    enabled: false
    custom_sampledir: "{{ playbook_dir }}/custom_sampledata"
    custom_sampledatasets: "{{ playbook_dir }}/custom_sampledata/datasets"
    custom_sampledataverses: "{{ playbook_dir }}/custom_sampledata/dataverses"
    custom_sampleusers: "{{ playbook_dir }}/custom_sampledata/users"
    custom_samplefiles: "{{ playbook_dir }}/custom_sampledata/files"

  # Custom metadata blocks
  custom_metadata_blocks:
    enabled: false
    urls: []

  # Unit tests
  unittests:
    enabled: false
    argument: '-DcompilerArgument=-Xlint:unchecked test -P all-unit-tests'

  # Options
  options:
    filepids:
    maxfileuploadsizeinbytes:
    provcollectionenabled:
    tabularingestsizelimit:

  # Default storage
  default:
    config:
    storage_id: file

  demo: false

  # Deployment
  deployment:
    upgrade_only: false

  # File storage
  filesdirs:
    - label: file
      path: /usr/local/dvn/data

  # PIDs
  pid:
    authority: "10.5072"
    protocol: doi
    shoulder: "FK2/"

  # DOI
  doi:
    baseurl: "https://mds.test.datacite.org/"
    dataciterestapiurl: "https://api.test.datacite.org"
    mdcbaseurl: "https://api.test.datacite.org/"
    provider: FAKE
    username: "testaccount"
    password: "notmypassword"

  # External tools
  externaltools:
    datacurationtool:
      enabled: false
      method: demo
    dataexplorer:
      enabled: true
    wholetale:
      enabled: false

  # Root dataverse
  root:
    name: "Root Dataverse"
    affiliation: "Example Organization"
    description: "The root dataverse collection"

  # Harvest clients
  harvest_clients: []

  # Handle.net
  handlenet:
    independenthandleservice: 'false'
    admcredfile: "{{ dataverse_misc_files_dir | default('/opt/dv') }}/admpriv.bin"
    admcredfile_source: files/handlenet/admcredfile

  # Counter/Make Data Count
  counter:
    enabled: false
    hub_api_token: set_me_in_secrets
    hub_base_url: "https://api.datacite.org"
    machines_url: "https://raw.githubusercontent.com/CDLUC3/Make-Data-Count/master/user-agents/lists/machine.txt"
    maxmind_geoip_country_path: "maxmind_geoip/GeoLite2-Country.mmdb"
    output_file: "/dataverse/sushi_sample_logs"
    output_format: json
    platform: dash
    robots_url: "https://raw.githubusercontent.com/CDLUC3/Make-Data-Count/master/user-agents/lists/robot.txt"
    version: "0.1.04"
    upload_to_hub: false
    user: counter
    year_month: "2018-05"

  # Solr
  solr:
    download_url: "https://archive.apache.org/dist/solr/solr/9.8.0/solr-9.8.0.tgz"
    group: solr
    root: /usr/local/solr
    user: solr
    version: 9.8.0
    listen: 127.0.0.1
    checksum: sha256:9948dcf798c196b834c4cbb420d1ea5995479431669d266c33d46548b67e69e1

  # Payara
  payara:
    user: dataverse
    group: dataverse
    domain: domain1
    logformat: ulf
    adminuser: admin
    adminpass: notPr0d
    siteurl:
    listen_address: 127.0.0.1
    launch_timeout: 180
    request_timeout: 1800
    root: /usr/local
    dir: payara6
    zipurl: https://nexus.payara.fish/repository/payara-community/fish/payara/distributions/payara/6.2025.3/payara-6.2025.3.zip
    zipchecksum: sha256:88f5c1e5b40ea4bc60ae3e34e6858c1b33145dc06c4b05c3d318ed67c131e210

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
db:
  use_rds: false
  postgres:
    enabled: true
    name: dvndb
    user: dvnuser
    pass: dvnsecret
    adminpass: DVn33dsth1s
    host: localhost
    port: 5432
    version: 16
    jdbcurl:
    log_lock_waits: true
    log_statements: none
    query_counts: false
    replication:
      enabled: false
      servers: []
  backups:
    enabled: false

# =============================================================================
# ADDITIONAL SERVICES
# =============================================================================
prometheus:
  install: false

schemaspy:
  enabled: false

shibboleth:
  enabled: false

rserve:
  install: false
  host: localhost
  port: 6311
  user: rserve
  group: rserve
  pass: rserve
  workdir: /tmp/Rserv

postfix:
  enabled: false

sshkeys:
  enabled: false
