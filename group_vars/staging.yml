# group_vars/staging.yml
# UCLA Dataverse staging environment configuration
#
# This file contains variables specific to the staging environment.
# Variables in this file override defaults/main.yml
#
# See CONFIG_STRATEGY.md for configuration approach
#
# =============================================================================
# TWO-STAGE DEPLOYMENT PROCESS
# =============================================================================
#
# Stage 1 - Initial Deployment (HTTP only):
#   Set apache.ssl.enabled: false and letsencrypt.enabled: false
#   Run: ansible-playbook -i inventory/staging.yml site.yml
#   This gets Dataverse running on HTTP (port 80)
#
# Stage 2 - Enable HTTPS with Let's Encrypt:
#   Set apache.ssl.enabled: true and letsencrypt.enabled: true
#   Run: ansible-playbook -i inventory/staging.yml site.yml
#   Certbot will automatically obtain SSL certificate and configure Apache
#
# After Stage 2, the site will be accessible via HTTPS with automatic renewals
# =============================================================================

---
# =============================================================================
# DATAVERSE CORE CONFIGURATION
# =============================================================================

dataverse_hostname: staging.ucladataverse.dev
dataverse_siteurl: "https://staging.ucladataverse.dev"  # HTTPS with Let's Encrypt
dataverse_http_port: 8080
dataverse_adminemail: "dataverse-admin@ucla.edu"  # REPLACE with your admin email
dataverse_service_email: "noreply-dataverse@ucla.edu"  # REPLACE with your service email
dataverse_system_email: "noreply-dataverse@ucla.edu"  # System email for Dataverse notifications
dataverse_adminpass: "CHANGE_ME_IN_VAULT"  # TODO: Move to ansible-vault

# =============================================================================
# OPTIONAL FEATURES
# =============================================================================

dataverse_use_ssl: false  # TODO: Enable after configuring Let's Encrypt (#13)
dataverse_use_shib: false  # TODO: Enable for SSO (#11)
dataverse_enable_telemetry: false

# =============================================================================
# DOI / PERSISTENT IDENTIFIERS
# =============================================================================

# Use DataCite test environment for staging
dataverse_doi_provider: datacite  # Options: datacite, ezid, fake, none
dataverse_doi_authority: "10.80343"  # DataCite test prefix - REPLACE with UCLA's prefix
dataverse_doi_username: ""  # TODO: Add to ansible-vault
dataverse_doi_password: ""  # TODO: Add to ansible-vault

# =============================================================================
# EMAIL / SMTP
# =============================================================================

dataverse_smtp_host: smtp.ucla.edu  # VERIFY UCLA SMTP server
dataverse_smtp_port: 587
# TODO: Add SMTP auth if required

# =============================================================================
# APACHE CONFIGURATION
# =============================================================================

dataverse_apache_config_dir: "/etc/httpd/conf.d"
dataverse_apache_user: apache
dataverse_apache_group: apache

apache:
  enabled: true
  port: 80
  public_fqdn: "staging.ucladataverse.dev"  # REQUIRED: Set to your domain
  ssl:
    enabled: true  # Stage 1: false, Stage 2: true
    port: 443
    cert: ""
    key: ""
    interm: ""
    remote_cert: false
    pem:
      cert: ""
  behind_ssl_reverse_proxy: false
  block:
    admin: true          # Block /api/admin via proxy
    destroy: true        # Block destroy endpoint
    builtin_users: true  # Block builtin-users endpoint
    sword: true          # Block SWORD API
  use_ajp: true         # Use AJP connector (recommended)

letsencrypt:
  enabled: true  # Stage 1: false, Stage 2: true
  certbot:
    autorenew: true
    email: "letsencrypt@ucla.edu"
    user: certbot
    test_cert: false  # Set to true for testing to avoid rate limits

# =============================================================================
# SOLR CONFIGURATION
# =============================================================================

dataverse_solr_version: 9.8.0
dataverse_solr_core_name: collection1

# =============================================================================
# POSTGRESQL CONFIGURATION
# =============================================================================

dataverse_postgresql_version: 16
dataverse_postgresql_user: dvnuser
dataverse_postgresql_db: dvndb
dataverse_postgresql_host: localhost
dataverse_postgresql_port: 5432
dataverse_postgresql_password: "CHANGE_ME_IN_VAULT"  # TODO: Move to ansible-vault
dataverse_postgresql_admin_user: postgres
dataverse_postgresql_admin_password: "CHANGE_ME_IN_VAULT"  # TODO: Move to ansible-vault

# PostgreSQL tuning (adjust based on EC2 instance size)
dataverse_postgresql_log_lock_waits: true
dataverse_postgresql_log_statements: all  # Use 'all' for staging debugging
dataverse_postgresql_query_counts: true
dataverse_use_rds: false  # Set to true if using AWS RDS

# PostgreSQL backups
dataverse_postgresql_backups_enabled: true  # Enable for staging
dataverse_postgresql_backup_rootdir: /opt/pg_backups
dataverse_postgresql_backup_backupdir: backups
dataverse_postgresql_backup_host: localhost
dataverse_postgresql_backup_user: postgres
dataverse_postgresql_backup_custom: 'yes'
dataverse_postgresql_backup_globals: 'yes'
dataverse_postgresql_backup_plain: 'no'

# =============================================================================
# PAYARA CONFIGURATION
# =============================================================================

dataverse_payara_version: 5.2022.5
dataverse_payara_domain: domain1
dataverse_payara_listen_address: 127.0.0.1  # Localhost only - Apache proxies

# NOTE: Must specify complete nested structure due to Ansible dict merging behavior
# See group_vars/all.yml for explanation and base defaults
# Ansible's default hash_behaviour is 'replace', not 'merge', so defining dataverse:
# here will completely replace the dataverse dict from all.yml/defaults
dataverse:
  version: '6.8'
  adminpass: "{{ dataverse_adminpass }}"  # Reference the top-level variable
  allow_signups: true
  thumbnails: false
  srcdir: /opt/dataverse/dataverse
  uploads_dir: /tmp
  usermgmtkey: burrito
  service_email: "{{ dataverse_service_email }}"
  smtp: "{{ dataverse_smtp_host }}"
  memheap: 2048
  file_fixity_checksum_algorithm: "MD5"
  google_analytics_key:
  copyright: "UC Regents"
  branding:
    enabled: true
    directory: "{{ playbook_dir }}/files/branding"
    favicons_directory: "{{ playbook_dir }}/files/favicons"
    fileSettings:
      - setting: HeaderCustomizationFile
        file: custom-header.html
      - setting: StyleCustomizationFile
        file: custom-stylesheet.css
      - setting: LogoCustomizationFile
        file: dataverseUCLA_logo.png
      - setting: HomePageCustomizationFile
        file: custom-homepage.html
      - setting: FooterCustomizationFile
        file: custom-footer.html
    otherSettings:
      - setting: FooterCopyright
        value: " UC Regents"
      - setting: InstallationName
        value: "UCLA Dataverse"
  language:
    enabled: true
    languages:
      - locale: en_US
        title: English
    language_packs:
      source: https://github.com/GlobalDataverseCommunityConsortium/dataverse-language-packs.git
      version: develop
    lang_directory: "/opt/dv/lang"
  licenses:
    enabled: true
    user: dataverseAdmin
    licenses:
      - name: CC0 1.0
        uri: http://creativecommons.org/publicdomain/zero/1.0
        shortDescription: Creative Commons CC0 1.0 Universal Public Domain Dedication.
        iconUrl: https://licensebuttons.net/p/zero/1.0/88x31.png
        active: true
        sortOrder: 1
  frontend:
    enabled: false
  previewers:
    enabled: true
    on_same_server: true
    zip_url: https://github.com/gdcc/dataverse-previewers/releases/download/1.2/dataverse-previewers-1.2.zip
    dir: /var/www/html
  api:
    test_suite: false
    allow_lookup: true
    blocked_endpoints: "builtin-users,test"
    blocked_policy: ""
    location: "http://localhost:8080/api"
  jacoco:
    enabled: false
    home: /tmp/jacoco
    version: 0.8.12
  sampledata:
    enabled: false
    use_api: true
    collection_name: "UCLA Data Science Center"
    collection_alias: "ucla-dsc"
    collection_description: "Research data from the UCLA Library Data Science Center."
    contact_email: "datascience@library.ucla.edu"
    affiliation: "UCLA Library"
    dir: /tmp/sampledata
    repo: https://github.com/IQSS/dataverse-sample-data.git
    branch: master
    venv: /tmp/sampledata/venv
  custom_sampledata:
    enabled: false
  custom_metadata_blocks:
    enabled: false
  unittests:
    enabled: false
    argument: '-DcompilerArgument=-Xlint:unchecked test -P all-unit-tests'
  options:
    filepids:
    maxfileuploadsizeinbytes:
    provcollectionenabled:
    tabularingestsizelimit:
  default:
    config:
    storage_id: file
  demo: false
  deployment:
    upgrade_only: false
  filesdirs:
    - label: file
      path: /usr/local/dvn/data
  pid:
    authority: "10.5072"
    protocol: doi
    shoulder: "FK2/"
  doi:
    baseurl: "https://mds.test.datacite.org/"
    dataciterestapiurl: "https://api.test.datacite.org"
    mdcbaseurl: "https://api.test.datacite.org/"
    provider: FAKE
    username: "testaccount"
    password: "notmypassword"
  externaltools:
    datacurationtool:
      enabled: false
    dataexplorer:
      enabled: true
    wholetale:
      enabled: false
  root:
    name: "UCLA Dataverse"
    affiliation: "UCLA Library"
    description: "UCLA Dataverse Repository"
  harvest_clients: []
  handlenet:
    independenthandleservice: 'false'
  counter:
    enabled: false
  solr:
    download_url: "https://archive.apache.org/dist/solr/solr/{{ dataverse_solr_version }}/solr-{{ dataverse_solr_version }}.tgz"
    group: solr
    root: /usr/local/solr
    user: solr
    version: "{{ dataverse_solr_version }}"
    listen: 127.0.0.1
    checksum: sha256:9948dcf798c196b834c4cbb420d1ea5995479431669d266c33d46548b67e69e1
  payara:
    user: dataverse
    group: dataverse
    domain: domain1
    logformat: ulf
    adminuser: admin
    adminpass: notPr0d  # Payara admin (not Dataverse admin)
    siteurl: "https://staging.ucladataverse.dev"
    listen_address: 127.0.0.1  # Use 127.0.0.1 for production (behind Apache proxy)
    launch_timeout: 180
    request_timeout: 1800
    root: /usr/local
    dir: payara6
    zipurl: https://nexus.payara.fish/repository/payara-community/fish/payara/distributions/payara/6.2025.3/payara-6.2025.3.zip
    zipchecksum: sha256:88f5c1e5b40ea4bc60ae3e34e6858c1b33145dc06c4b05c3d318ed67c131e210

# JVM options (adjust based on EC2 instance size)
# Recommendation: Start with 25% of available RAM for Xmx
dataverse_jvm_options:
  - "-Xms2g"      # Initial heap size
  - "-Xmx4g"      # Maximum heap size - ADJUST based on instance RAM
  - "-XX:+UseG1GC"
  - "-XX:MaxGCPauseMillis=200"

# =============================================================================
# R / RSERVE (Optional - for statistical analysis)
# =============================================================================

rserve:
  install: false  # Set to true if needed for R-based statistical analysis
  host: localhost
  port: 6311
  user: rserve
  group: rserve
  pass: rserve
  workdir: /tmp/Rserv

# =============================================================================
# ADDITIONAL SETTINGS
# =============================================================================

# Database settings
# NOTE: Must specify complete structure due to Ansible dict merging
db:
  use_rds: false
  postgres:
    enabled: true
    version: 16
    user: dvnuser
    pass: "{{ dataverse_postgresql_password }}"
    name: dvndb
    adminpass: "{{ dataverse_postgresql_admin_password }}"
    host: localhost
    port: 5432
    jdbcurl:
    log_lock_waits: true
    log_statements: none
    query_counts: false
    replication:
      enabled: false
      servers: []
  backups:
    enabled: false

# API settings
api:
  allow_lookup: true
  blocked_endpoints: "builtin-users,test"
  blocked_policy: ""
  location: "http://localhost:8080/api"
  test_suite: false

# Branding (optional)
# dataverse:
#   branding:
#     enabled: true
#     directory: "{{ playbook_dir }}/files/branding"
#   copyright: "UC Regents"

# =============================================================================
# SECURITY HARDENING
# =============================================================================
dataverse_security:
  blocked_endpoints: "admin,builtin-users,test,sword"
  blocked_policy: "localhost-only"
  exclude_email_from_export: true
  password:
    min_length: 12
    max_length: 128
    consecutive_digits_allowed: 2
    character_rules: "UpperCase:1,LowerCase:1,Digit:1,Special:1"
    number_of_characteristics: 3
    dictionaries: "common-passwords"
    good_strength: 20
  ip_source_header: "X-Forwarded-For"
  session_timeout: 480
  allow_custom_terms: false
  samesite_cookie: "Lax"

# =============================================================================
# SMTP & RATE LIMITING
# =============================================================================
dataverse_smtp:
  enabled: true
  host: "smtp.ucla.edu"
  port: 587
  system_email: "noreply-dataverse@ucla.edu"
  support_email: "dataverse-support@ucla.edu"
  auth: false
  starttls: true

dataverse_rate_limiting:
  enabled: true
  default_capacity_tiers: "10000,20000"
  capacity_by_tier_and_action:
    - tier: 0
      limitPerHour: 100
      actions:
        - "GetLatestPublishedDatasetVersionCommand"
        - "GetPrivateUrlCommand"
    - tier: 1
      limitPerHour: 1000
      actions:
        - "GetLatestPublishedDatasetVersionCommand"